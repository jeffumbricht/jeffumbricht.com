[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The old Gatsby site registered a service worker at /sw.js. Make sure browsers
# always fetch the fresh (self-unregistering) version instead of a cached one.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
